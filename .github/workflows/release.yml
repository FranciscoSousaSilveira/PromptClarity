name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install root dependencies
        run: npm ci

      - name: Install desktop dependencies
        run: npm ci
        working-directory: apps/desktop-app

      - name: Run tests
        run: npm test

      - name: Type check desktop app
        run: npm run desktop:typecheck

      - name: Lint
        run: npm run lint

      - name: Package installer
        run: npm run package
        working-directory: apps/desktop-app
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/desktop/PromptClarity Setup *.exe
            release/desktop/*.blockmap
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
